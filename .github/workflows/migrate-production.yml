name: Migrate production (one-off)

# Manual, deliberate operation only - see docs/RESTORE.md's "Apply required
# infrastructure/configuration" step. Not on any schedule. Applies the
# already-committed, already-reviewed migrations in drizzle/ to Production
# using the NEON_BACKUP_DATABASE_URL secret that already exists for backups
# (GitHub Actions only, never in Vercel - see docs/CLOUD_FOUNDATION.md).
# Remove this workflow again once the one-off migration it exists for has
# run; recreate it (or run scripts/db/migrate.ts locally per RESTORE.md) the
# next time Production's schema needs to catch up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      VERCEL_ENV: production
      NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not `npm run db:migrate` - that script hardcodes --env-file=.env.local
      # for local use, and no .env.local exists in CI. Env vars already come
      # from this job's `env:` block instead.
      - name: Apply migrations to production
        run: npx tsx scripts/db/migrate.ts

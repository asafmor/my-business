<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        />
        <style>
          :root {
            --canvas: #f0f0f3;
            --surface: #ffffff;
            --sunk: #f6f6f8;
            --sunk2: #eaeaee;
            --ink: #15151c;
            --ink2: #55555f;
            --ink3: #8b8b95;
            --hair: rgba(21, 21, 28, 0.07);
            --purple: #4a3a80;
            --purple2: #3b2e68;
            --purpleSoft: #edeaf7;
            --navy: #2c4177;
            --navySoft: #e8ecf7;
            --cream: #efe4c8;
            --creamInk: #77622f;
            --creamSoft: #faf3e2;
            --pos: #2f6b51;
            --posSoft: #e6efea;
            --neg: #9d4436;
            --negSoft: #f7e9e5;
            --e1:
              0 1px 1px rgba(21, 21, 28, 0.04),
              0 2px 5px -2px rgba(21, 21, 28, 0.06);
            --e2:
              0 1px 2px rgba(21, 21, 28, 0.05),
              0 8px 18px -6px rgba(21, 21, 28, 0.13);
            --lip: inset 0 1px 0 rgba(255, 255, 255, 0.85);
            --well:
              inset 0 1px 2px rgba(21, 21, 28, 0.07),
              inset 0 0 0 1px rgba(21, 21, 28, 0.045);
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: var(--navy);
            text-decoration: none;
          }
          a:hover {
            color: var(--purple);
          }
          .num {
            font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
          }
          .lbl {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--ink3);
          }
          .f {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 54px;
            padding: 8px 13px;
            background: var(--surface);
          }
          .f + .f {
            box-shadow: inset 0 1px 0 var(--hair);
          }
          .fl {
            flex: 0 0 96px;
            font-size: 12.5px;
            color: var(--ink3);
            font-weight: 500;
          }
          .fv {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-align: right;
          }
        </style>
      </helmet>

      <div
        style="
          width: 390px;
          height: 844px;
          background: var(--canvas);
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <!-- space reserved for the device status bar: intentionally empty -->
        <div style="height: 50px; flex: 0 0 50px"></div>

        <!-- Task bar -->
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px 8px;
          "
        >
          <span
            style="
              width: 44px;
              height: 44px;
              border-radius: 13px;
              display: flex;
              align-items: center;
              justify-content: center;
              background: #fff;
              box-shadow: var(--e1), var(--lip);
              color: var(--ink2);
            "
          >
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m14 6-6 6 6 6" />
            </svg>
          </span>
          <span style="flex: 1; text-align: center">
            <span
              style="
                display: block;
                font-size: 14.5px;
                font-weight: 700;
                letter-spacing: -0.01em;
              "
              >Review inbox</span
            >
            <span
              class="num"
              style="
                display: block;
                font-size: 11.5px;
                color: var(--ink3);
                margin-top: -2px;
              "
              >2 of 6</span
            >
          </span>
          <span
            style="
              display: inline-flex;
              align-items: center;
              justify-content: center;
              min-width: 44px;
              height: 44px;
              padding: 0 12px;
              border-radius: 13px;
              font-size: 13.5px;
              font-weight: 600;
              color: var(--ink3);
            "
            >Skip</span
          >
        </div>

        <!-- Progress -->
        <div style="display: flex; gap: 4px; padding: 0 16px 12px">
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: var(--purple);
            "
          ></span>
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: var(--purple);
            "
          ></span>
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: #d6d6de;
            "
          ></span>
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: #d6d6de;
            "
          ></span>
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: #d6d6de;
            "
          ></span>
          <span
            style="
              flex: 1;
              height: 4px;
              border-radius: 99px;
              background: #d6d6de;
            "
          ></span>
        </div>

        <div
          style="
            flex: 1;
            min-height: 0;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >
          <!-- Document preview -->
          <div
            style="
              position: relative;
              height: 162px;
              border-radius: 14px;
              background: linear-gradient(180deg, #e9e9ee, #e1e1e8);
              box-shadow: var(--well);
              overflow: hidden;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="116"
              height="146"
              viewBox="0 0 116 146"
              style="filter: drop-shadow(0 8px 18px rgba(21, 21, 28, 0.22))"
            >
              <path
                d="M8 6h100v128l-9-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-9 5z"
                fill="#fff"
              />
              <rect
                x="22"
                y="22"
                width="52"
                height="7"
                rx="2"
                fill="#15151c"
                opacity=".78"
              />
              <rect
                x="22"
                y="36"
                width="32"
                height="5"
                rx="2"
                fill="#8b8b95"
                opacity=".6"
              />
              <rect x="22" y="56" width="72" height="4" rx="2" fill="#c6c6ce" />
              <rect x="22" y="66" width="60" height="4" rx="2" fill="#c6c6ce" />
              <rect x="22" y="76" width="68" height="4" rx="2" fill="#c6c6ce" />
              <rect x="22" y="86" width="44" height="4" rx="2" fill="#c6c6ce" />
              <rect x="22" y="100" width="72" height="1.5" fill="#d6d6de" />
              <rect
                x="22"
                y="108"
                width="26"
                height="6"
                rx="2"
                fill="#8b8b95"
                opacity=".7"
              />
              <rect
                x="64"
                y="107"
                width="30"
                height="8"
                rx="2.5"
                fill="#4a3a80"
              />
            </svg>
            <span
              style="
                position: absolute;
                right: 10px;
                bottom: 10px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 34px;
                padding: 0 12px;
                border-radius: 10px;
                background: rgba(27, 27, 36, 0.86);
                color: #fff;
                font-size: 12.5px;
                font-weight: 600;
                box-shadow: 0 6px 16px -4px rgba(21, 21, 28, 0.5);
              "
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />
              </svg>
              Full page
            </span>
            <span
              style="
                position: absolute;
                left: 10px;
                top: 10px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                padding: 0 10px;
                border-radius: 9px;
                background: rgba(255, 255, 255, 0.92);
                font-size: 11.5px;
                font-weight: 600;
                color: var(--ink2);
                box-shadow: var(--e1);
              "
              >IMG_4821.heic</span
            >
          </div>

          <!-- Extracted fields -->
          <div>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 8px;
              "
            >
              <span class="lbl">What we read</span>
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 5px;
                  font-size: 11px;
                  font-weight: 600;
                  color: var(--creamInk);
                "
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                >
                  <path d="M12 8v5M12 16.5v.01" />
                  <circle cx="12" cy="12" r="9" />
                </svg>
                1 field to confirm
              </span>
            </div>

            <div
              style="
                border-radius: 14px;
                overflow: hidden;
                box-shadow: var(--e1), var(--lip);
              "
            >
              <div class="f">
                <span class="fl">Supplier</span>
                <span class="fv">SodaStream Ltd</span>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#c6c6ce"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </div>
              <div class="f">
                <span class="fl">Date</span>
                <span class="fv num">13 Jun 2026</span>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#c6c6ce"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </div>
              <div class="f">
                <span class="fl">Total</span>
                <span class="fv num" style="font-size: 17px">₪ 280.00</span>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#c6c6ce"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </div>
              <div class="f">
                <span class="fl">VAT · 18%</span>
                <span class="fv num">₪ 42.71</span>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#c6c6ce"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </div>

              <!-- low confidence field -->
              <div
                class="f"
                style="
                  background: linear-gradient(
                    90deg,
                    rgba(239, 228, 200, 0.55),
                    rgba(239, 228, 200, 0.2)
                  );
                  box-shadow:
                    inset 3px 0 0 var(--cream),
                    inset 0 1px 0 var(--hair);
                  align-items: flex-start;
                  padding-top: 10px;
                  padding-bottom: 11px;
                "
              >
                <span class="fl" style="padding-top: 3px">Category</span>
                <span style="flex: 1; min-width: 0; text-align: right">
                  <span
                    style="
                      display: block;
                      font-size: 15px;
                      font-weight: 600;
                      letter-spacing: -0.01em;
                    "
                    >Office</span
                  >
                  <span
                    style="
                      display: block;
                      font-size: 11.5px;
                      color: var(--creamInk);
                      margin-top: -1px;
                    "
                    >Our best guess — confirm or change</span
                  >
                  <span style="display: inline-flex; gap: 7px; margin-top: 7px">
                    <span
                      style="
                        display: inline-flex;
                        align-items: center;
                        height: 32px;
                        padding: 0 13px;
                        border-radius: 9px;
                        background: #fff;
                        box-shadow: var(--e1), var(--lip);
                        font-size: 12.5px;
                        font-weight: 600;
                        color: var(--ink2);
                      "
                      >Change</span
                    >
                    <span
                      style="
                        display: inline-flex;
                        align-items: center;
                        gap: 5px;
                        height: 32px;
                        padding: 0 13px;
                        border-radius: 9px;
                        background: #fff;
                        box-shadow: var(--e1), var(--lip);
                        font-size: 12.5px;
                        font-weight: 600;
                        color: var(--pos);
                      "
                    >
                      <svg
                        width="13"
                        height="13"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="m5 13 4.5 4.5L19 7" />
                      </svg>
                      Keep
                    </span>
                  </span>
                </span>
              </div>

              <div class="f">
                <span class="fl">Project</span>
                <span class="fv" style="color: var(--ink3); font-weight: 500"
                  >Not assigned</span
                >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#c6c6ce"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Sticky action bar -->
        <div
          style="
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 12px 16px 26px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
              0 -1px 0 var(--hair),
              0 -10px 28px -14px rgba(21, 21, 28, 0.22);
          "
        >
          <span
            style="
              display: inline-flex;
              align-items: center;
              justify-content: center;
              height: 50px;
              padding: 0 18px;
              border-radius: 14px;
              background: #fff;
              box-shadow: var(--e1), var(--lip);
              font-size: 14px;
              font-weight: 600;
              color: var(--ink2);
            "
            >Fix it</span
          >
          <span
            style="
              flex: 1;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              height: 50px;
              border-radius: 14px;
              background: linear-gradient(180deg, #584697, #4a3a80);
              color: #fff;
              font-size: 15px;
              font-weight: 600;
              box-shadow:
                0 1px 1px rgba(21, 21, 28, 0.12),
                0 8px 18px -5px rgba(74, 58, 128, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.24);
            "
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 13 4.5 4.5L19 7" />
            </svg>
            Confirm &amp; next
          </span>
        </div>
      </div>
    </x-dc>
  </body>
</html>
